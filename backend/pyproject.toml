[project]
name = "report-analysis-agent"
version = "0.1.0"
description = "基于 DeepAgents 架构与 Agentic RAG 的多智能体协同研报分析系统"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    # DeepAgents
    "deepagents==0.6.1",

    # LangChain
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",

    # RAG Components
    "chromadb>=0.5.0",
    "pypdf>=5.0.0",
    "pdfplumber>=0.11.0",

    # Embeddings
    "sentence-transformers>=3.0.0",

    # Data Analysis
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "matplotlib>=3.8.0",

    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # Web Search (fallback)
    "tavily-python>=0.5.0",

    # Utilities
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
